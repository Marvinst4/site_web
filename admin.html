<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Administration - Les Jeunes Aventuriers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="logo.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin-page">
      <a class="brand" href="index.html"><img class="brand-logo" src="images/logo-petits-explorateurs.png" alt="Logo Les Jeunes Aventuriers" /><span>Les Petits<br /><strong>Explorateurs</strong></span></a>
      <section id="login-panel" class="admin-card">
        <p class="eyebrow">Espace privé</p><h1>Administration</h1>
        <p>Connectez-vous pour ajouter une activité. Cet espace n’est pas accessible aux visiteurs.</p>
        <form id="login-form"><label>Adresse e-mail<input name="email" type="email" autocomplete="email" required /></label><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required /></label><button class="button" type="submit">Se connecter <span>→</span></button></form>
        <p id="login-message" class="admin-message" aria-live="polite"></p>
      </section>
      <section id="dashboard-panel" class="admin-card" hidden>
        <div class="admin-heading"><div><p class="eyebrow">Espace privé</p><h1>Ajouter une activité</h1></div><button id="logout-button" class="text-link" type="button">Se déconnecter</button></div>
        <p>La sortie sera visible immédiatement dans la liste publique des activités.</p>
        <form id="activity-admin-form"><label>Titre<input name="title" required maxlength="160" placeholder="Ex. Journée au musée" /></label><label>Date<input name="date" type="date" required /></label><label>Lieu<input name="place" required maxlength="160" placeholder="Ex. Musée d'Orsay" /></label><label>Places disponibles<input name="spots" type="number" min="1" max="500" value="20" required /></label><label>Catégorie<select name="category"><option>Culture</option><option>Loisirs</option><option>Nature</option><option>Sport</option></select></label><button class="button" type="submit">Publier l’activité <span>→</span></button></form>
        <p id="activity-message" class="admin-message" aria-live="polite"></p>
      </section>
    </main>
    <script src="supabase-config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
